    n: 12167
    factorization_n: "23^3"
    n_plus_1: 12168
    factorization_n_plus_1: "2^3 * 3^2 * 13^2"
    square_bounds: "110^2 = 12100 < 12167 < 12168 < 12321 = 111^2"

